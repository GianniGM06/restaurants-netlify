[build]
  publish = "public"
  functions = "netlify/functions"

# ALLOWED_GITHUB_USERS (logins autorisés en écriture, séparés par des virgules)
# peut être défini dans le dashboard Netlify — défaut : giannigm06

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    # Scripts : aucun inline (handlers en addEventListener, thème dans theme-init.js)
    # et aucun CDN (Bootstrap/Icons/Leaflet auto-hébergés dans /vendor).
    # style 'unsafe-inline' conservé pour les attributs style des templates.
    # img-src https: nécessaire pour les photos externes (Unsplash, Imgur…) et les tuiles OSM.
    # NB : valeur mono-ligne obligatoire — un header multi-lignes fait planter `netlify dev`.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self'; connect-src 'self' https://api.github.com https://nominatim.openstreetmap.org; worker-src 'none'; frame-ancestors 'none'"

# Assets vendorés : cache long (on change le chemin si on change de version)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  framework = "#static"