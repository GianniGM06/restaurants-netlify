[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  GITHUB_OWNER = "giannigm06"
  GITHUB_REPO = "Restaurants_data"
  GITHUB_FILE = "restaurants.json"
  # GITHUB_TOKEN doit être défini dans le dashboard Netlify (Environment Variables), jamais ici

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com;
      img-src 'self' data: https: blob:;
      font-src 'self' https://cdn.jsdelivr.net;
      connect-src 'self' https://api.github.com https://nominatim.openstreetmap.org https://*.neon.tech;
      worker-src 'none';
      frame-ancestors 'none';
    """

[dev]
  framework = "#static"