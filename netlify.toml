[build]
  publish = "public"
  functions = "netlify/functions"

# ALLOWED_GITHUB_USERS (logins autorisés en écriture, séparés par des virgules)
# peut être défini dans le dashboard Netlify — défaut : giannigm06

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    # Scripts : aucun inline (handlers en addEventListener, thème dans theme-init.js).
    # style 'unsafe-inline' conservé pour les attributs style des templates.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      img-src 'self' data: https: blob:;
      font-src 'self' https://cdn.jsdelivr.net;
      connect-src 'self' https://api.github.com https://nominatim.openstreetmap.org;
      worker-src 'none';
      frame-ancestors 'none';
    """

[dev]
  framework = "#static"