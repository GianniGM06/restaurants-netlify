[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  GITHUB_TOKEN = "your_github_token_here"
  GITHUB_OWNER = "giannigm06"
  GITHUB_REPO = "Restaurants_data"
  GITHUB_FILE = "restaurants.json"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  framework = "#static"